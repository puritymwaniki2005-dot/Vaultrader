          /* Keep Vaultrader's outer navigation; remove the duplicate navigation inside the embedded bot. */
          .tnx-hide-inner-navigation { display:none !important; }

        <script>
          (() => {
            const normalize = value => String(value || '').replace(/\s+/g, ' ').trim();
            const labels = ['Dashboard', 'Bot Builder', 'Charts', 'Tutorials'];
            const important = (node, name, value) => node.style.setProperty(name, value, 'important');
            const hasMenuLabels = node => {
              const value = normalize(node.innerText || node.textContent);
              return labels.every(label => value.includes(label));
            };
            const hide = node => {
              if (!node) return;
              node.classList.add('tnx-hide-inner-navigation');
              important(node, 'display', 'none');
            };
            const cleanEmbeddedChrome = () => {
              // The parent dashboard now owns the site's navigation. Remove the duplicate
              // Deriv-app menu so the Blockly canvas starts directly beneath the app header.
              const menuCandidates = Array.from(document.querySelectorAll('#root *'))
                .filter(hasMenuLabels)
                .filter(node => !Array.from(node.children).some(hasMenuLabels));
              const menu = menuCandidates
                .filter(node => /^(NAV|UL|OL)$/.test(node.tagName) || node.getAttribute('role') === 'tablist')
                .sort((a,b) => a.querySelectorAll('*').length - b.querySelectorAll('*').length)[0]
                || menuCandidates.sort((a,b) => a.querySelectorAll('*').length - b.querySelectorAll('*').length)[0];
              if (menu) hide(menu);
              // Remove the duplicate in-app login/signup strip shown above the Blockly menu.
              const authLabels = Array.from(document.querySelectorAll('#root *')).filter(node => {
                if (node.children.length > 8) return false;
                const t = normalize(node.innerText || node.textContent).toLowerCase();
                return t.includes('log in') && t.includes('sign up');
              });
              const authStrip = authLabels
                .filter(node => !Array.from(node.children).some(child => {
                  const t = normalize(child.innerText || child.textContent).toLowerCase();
                  return t.includes('log in') && t.includes('sign up');
                }))
                .sort((a,b) => a.querySelectorAll('*').length - b.querySelectorAll('*').length)[0];
              if (authStrip) {
                const strip = authStrip.closest('header') || authStrip.parentElement;
                if (strip && strip !== document.getElementById('root')) hide(strip);
              }
              // Use the Mkorean-style light Blockly workspace, while preserving the live
              // Blockly controls, account connection UI and trade execution logic.
              document.body.style.setProperty('background', '#f5f6f8', 'important');
              document.querySelectorAll('.blocklyMainBackground').forEach(node => node.style.setProperty('fill', '#ffffff', 'important'));
              document.querySelectorAll('.blocklyToolboxDiv').forEach(node => {
                node.style.setProperty('background', '#f0f1f3', 'important');
                node.style.setProperty('color', '#303238', 'important');
              });
              document.querySelectorAll('.blocklyFlyoutBackground').forEach(node => node.style.setProperty('fill', '#f1f2f4', 'important'));
              document.querySelectorAll('body *').forEach(node => {
                if (node.children.length) return;
                const value = normalize(node.textContent);
                if (value.includes('DERIV TRADING MODE') && value.includes('REAL BUY requires confirmation')) {
                  hide(node.closest('[role="alert"], .notice, .banner, .alert') || node);
                }
              });
            };
            let queued = false;
            const scheduleCleanup = () => {
              if (queued) return;
              queued = true;
              requestAnimationFrame(() => { queued = false; cleanEmbeddedChrome(); });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', scheduleCleanup);
            else scheduleCleanup();
            new MutationObserver(scheduleCleanup).observe(document.documentElement, {childList:true,subtree:true});
          })();
        </script>

        <script>
            // Vaultrader embeds this application specifically as its Bot Builder.
            // Wait for React to mount, then select the original app's Bot Builder tab once.
            (function () {
                var attempts = 0;
                var timer = window.setInterval(function () {
                    attempts += 1;
                    var builder = document.getElementById("id-bot-builder");
                    if (builder) {
                        window.clearInterval(timer);
                        if (!builder.classList.contains("active") && !builder.getAttribute("aria-current")) {
                            builder.click();
                        }
                    } else if (attempts >= 80) {
                        window.clearInterval(timer);
                    }
                }, 250);
            })();
