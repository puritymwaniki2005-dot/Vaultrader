name: Build and deploy TradeNovaX React site
on:
  push:
    branches:
      - main
    paths:
      - "react-platform/**"
      - "vercel.json"
      - "js/auth.js"
      - ".github/workflows/react-platform-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-platform/package.json
      - name: Install React dependencies
        working-directory: react-platform
        run: npm install
      - name: Prepare full site while preserving legacy routes
        working-directory: react-platform
        run: node scripts/prepare-deploy.mjs
      - name: Build React landing and dashboard shell
        working-directory: react-platform
        run: npm run build
      - name: Verify preserved production routes
        run: |
          test -f react-platform/dist/index.html
          test -f react-platform/dist/legacy-index.html
          test -f react-platform/dist/dashboard.html
          test -f react-platform/dist/bot/index.html
          test -f react-platform/dist/CNAME
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-platform/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
