name: Verify Vaultrader dashboard runtime

on:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'scripts/test-dashboard-runtime.mjs'
      - '.github/workflows/verify-dashboard-runtime.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'scripts/test-dashboard-runtime.mjs'
      - '.github/workflows/verify-dashboard-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Blockly lifecycle and HTML structure
        run: node scripts/test-dashboard-runtime.mjs
