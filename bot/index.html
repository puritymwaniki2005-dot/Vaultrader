        <script>
          (() => {
            const normalize = value => String(value || '').replace(/\s+/g, ' ').trim();
            const labels = ['Dashboard', 'Bot Builder', 'Charts', 'Tutorials'];
            const hasMenuLabels = node => {
              const value = normalize(node.innerText || node.textContent);
              return labels.every(label => value.includes(label));
            };
            const important = (node, name, value) => node.style.setProperty(name, value, 'important');
            const cleanEmbeddedChrome = () => {
              // Find the smallest rendered container that owns all four app navigation items.
              const candidates = Array.from(document.querySelectorAll('#root *'))
                .filter(node => hasMenuLabels(node))
                .filter(node => !Array.from(node.children).some(hasMenuLabels));
              const menu = candidates
                .filter(node => /^(NAV|UL|OL)$/.test(node.tagName) || node.getAttribute('role') === 'tablist')
                .sort((a,b) => a.querySelectorAll('*').length - b.querySelectorAll('*').length)[0]
                || candidates.sort((a,b) => a.querySelectorAll('*').length - b.querySelectorAll('*').length)[0];
              if (menu) {
                menu.classList.add('tnx-mkorean-horizontal-nav');
                // Apply layout directly as well as through CSS, so framework styles cannot keep it vertical.
                ['display','flex'];
                important(menu, 'display', 'flex');
                important(menu, 'flex-direction', 'row');
                important(menu, 'align-items', 'center');
                important(menu, 'justify-content', 'flex-start');
                important(menu, 'flex-wrap', 'nowrap');
                important(menu, 'width', '100%');
                important(menu, 'max-width', '100%');
                important(menu, 'overflow-x', 'auto');
                important(menu, 'white-space', 'nowrap');
                important(menu, 'gap', '8px');
                important(menu, 'padding', '8px 12px');
                important(menu, 'box-sizing', 'border-box');
                Array.from(menu.querySelectorAll('a,button,[role="tab"],li')).forEach(item => {
                  important(item, 'display', 'inline-flex');
                  important(item, 'flex', '0 0 auto');
                  important(item, 'flex-direction', 'row');
                  important(item, 'align-items', 'center');
                  important(item, 'width', 'auto');
                  important(item, 'min-width', 'max-content');
                  important(item, 'white-space', 'nowrap');
                });
              }
              document.querySelectorAll('body *').forEach(node => {
                if (node.children.length) return;
                const value = normalize(node.textContent);
                if (value.includes('DERIV TRADING MODE') && value.includes('REAL BUY requires confirmation')) {
                  const banner = node.closest('[role="alert"], .notice, .banner, .alert') || node;
                  banner.classList.add('tnx-hide-inner-navigation');
                }
              });
            };
            let queued = false;
            const scheduleCleanup = () => {
              if (queued) return;
              queued = true;
              requestAnimationFrame(() => { queued = false; cleanEmbeddedChrome(); });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', scheduleCleanup);
            else scheduleCleanup();
            new MutationObserver(scheduleCleanup).observe(document.documentElement, {childList:true,subtree:true});
          })();
        </script>

        <script>
            // Vaultrader embeds this application specifically as its Bot Builder.
            // Wait for React to mount, then select the original app's Bot Builder tab once.
            (function () {
                var attempts = 0;
                var timer = window.setInterval(function () {
                    attempts += 1;
                    var builder = document.getElementById("id-bot-builder");
                    if (builder) {
                        window.clearInterval(timer);
                        if (!builder.classList.contains("active") && !builder.getAttribute("aria-current")) {

                    } else if (attempts >= 80) {
