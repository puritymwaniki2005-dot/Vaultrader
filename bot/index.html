        <script>
          (() => {
            const important = (node, name, value) => node && node.style.setProperty(name, value, 'important');
            const normalize = value => String(value || '').replace(/\s+/g, ' ').trim();
            const labels = ['Dashboard', 'Bot Builder', 'Charts', 'Tutorials'];
            const hasLabels = node => {
              const t = normalize(node && (node.innerText || node.textContent));
              return labels.every(label => t.includes(label));
            };
            const hide = node => {
              if (!node || node.id === 'root' || node === document.body) return;
              node.classList.add('tnx-hide-inner-navigation');
              important(node, 'display', 'none');
            };
            const applyWorkspace = () => {
              document.body.style.setProperty('background', '#f1f2f4', 'important');
              document.querySelectorAll('.blocklyMainBackground').forEach(node => node.style.setProperty('fill', '#ffffff', 'important'));
              document.querySelectorAll('.blocklyToolboxDiv').forEach(node => {
                node.style.setProperty('background', '#f0f1f3', 'important');
                node.style.setProperty('color', '#303238', 'important');
              });
              document.querySelectorAll('.blocklyFlyoutBackground').forEach(node => node.style.setProperty('fill', '#f1f2f4', 'important'));
              document.querySelectorAll('.blocklyScrollbarBackground').forEach(node => node.style.setProperty('fill', '#e4e5e7', 'important'));
            };
            const cleanEmbeddedChrome = () => {
              const root = document.getElementById('root');
              if (!root) return;
              // The outer Vaultrader dashboard owns the site menu and header. Hide the
              // duplicate inner menu by walking up from the stable Bot Builder tab ID.
              const builder = root.querySelector('#id-bot-builder');
              if (builder) {
                let node = builder;
                for (let level = 0; node && node.parentElement && level < 7; level++, node = node.parentElement) {
                  if (hasLabels(node)) {
                    hide(node);
                    break;
                  }
                }
              }
              // Fallback for builds where the tab ID changes: hide the smallest ancestor
              // that contains the four app tabs, preferring a real nav/tablist.
              if (!builder || root.querySelectorAll('.tnx-hide-inner-navigation').length === 0) {
                const candidates = Array.from(root.querySelectorAll('nav,[role="tablist"],ul,ol,div'))
                  .filter(hasLabels)
                  .sort((a,b) => a.querySelectorAll('*').length - b.querySelectorAll('*').length);
                if (candidates[0]) hide(candidates[0]);
              }
              // Hide only the embedded auth strip; leave the actual Vaultrader header intact.
              const login = Array.from(root.querySelectorAll('a,button,[role="button"]'))
                .find(node => normalize(node.innerText || node.textContent).toLowerCase() === 'log in');
              const signup = Array.from(root.querySelectorAll('a,button,[role="button"]'))
                .find(node => normalize(node.innerText || node.textContent).toLowerCase() === 'sign up');
              if (login && signup) {
                let common = login.parentElement;
                while (common && common !== root && !common.contains(signup)) common = common.parentElement;
                if (common && common !== root) {
                  // Climb to the compact header row, not the entire application root.
                  let strip = common;
                  for (let i=0; i<4 && strip.parentElement && strip.parentElement !== root; i++) strip=strip.parentElement;
                  hide(strip);
                }
              }
              const warning = Array.from(root.querySelectorAll('body *')).find(node => {
                const t=normalize(node.textContent);
                return !node.children.length && t.includes('DERIV TRADING MODE') && t.includes('REAL BUY requires confirmation');
              });
              if (warning) hide(warning.closest('[role="alert"],.notice,.banner,.alert') || warning);
              applyWorkspace();
            };
            let queued=false;
            const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;cleanEmbeddedChrome();});};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
            new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
          })();
        </script>

        <script>
            // Vaultrader embeds this application specifically as its Bot Builder.
            // Wait for React to mount, then select the original app's Bot Builder tab once.
            (function () {
                var attempts = 0;
                var timer = window.setInterval(function () {
                    attempts += 1;
                    var builder = document.getElementById("id-bot-builder");
                    if (builder) {
                        window.clearInterval(timer);
                        if (!builder.classList.contains("active") && !builder.getAttribute("aria-current")) {
                            builder.click();
                        }
                    } else if (attempts >= 80) {
                        window.clearInterval(timer);
                    }
                }, 250);
            })();
        </script>

        <script>
          // Keep Blockly's real workspace sized to the visible mobile viewport.
          // This uses Blockly APIs when exposed by the bundled app; it does not transform
          // SVG nodes directly, which would misalign pointer/touch interactions.
          (() => {
            let lastWidth = 0;
            let lastScale = 0;
            let queued = false;
            const getBlockly = () => window.Blockly || window.blockly || null;
            const resizeWorkspace = () => {
              const width = Math.max(320, document.documentElement.clientWidth || window.innerWidth || 320);
              const mobile = width <= 700;
              const blockly = getBlockly();
              const workspace = blockly && typeof blockly.getMainWorkspace === 'function'
                ? blockly.getMainWorkspace()
                : null;
              const canvas = document.querySelector('.blocklySvg, .blocklyWorkspace, .blocklyMainBackground');
              if (!canvas) return;
              const targetScale = 1; // Match the reference: keep Blockly blocks at full readable scale on phones.
              if (workspace && typeof workspace.setScale === 'function' && Math.abs(lastScale-targetScale) > 0.01) {
                try { workspace.setScale(targetScale); lastScale = targetScale; } catch (_) {}
              }
              if (workspace && blockly && typeof blockly.svgResize === 'function') {
                try { blockly.svgResize(workspace); } catch (_) {}
              }
              if (width !== lastWidth) {
                lastWidth = width;
                document.querySelectorAll('.blocklyToolboxDiv').forEach(node => {
                  node.style.maxWidth = mobile ? (width <= 420 ? '118px' : '136px') : '';
                });
              }
            };
            const schedule = () => {
              if (queued) return;
              queued = true;
              requestAnimationFrame(() => { queued = false; resizeWorkspace(); });
            };
            window.addEventListener('resize', schedule, { passive: true });
            window.addEventListener('orientationchange', () => setTimeout(schedule, 150), { passive: true });
            new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
            setInterval(schedule, 1200);
            schedule();
          })();
        </script>
